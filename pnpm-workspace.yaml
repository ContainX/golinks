packages:
  - apps/*
  - packages/*
allowBuilds:
  esbuild: true
  "@biomejs/biome": true
  embedded-postgres: true
  # Platform binaries for embedded-postgres, used by the API integration test harness.
  '@embedded-postgres/darwin-arm64': true
  '@embedded-postgres/darwin-x64': true
  '@embedded-postgres/linux-arm64': true
  '@embedded-postgres/linux-x64': true
minimumReleaseAgeExclude:
  - "@types/node@26.5.0"
